  - "&7AirDrops commands:"
  - "&9• &7/airdrop spawn"
  - "&9• &7/airdrop list"
  - "&9• &7/airdrop create <number>"
  - "&9• &7/airdrop reload"
  - "&9• &7/airdrop debug"

